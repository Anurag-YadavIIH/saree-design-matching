seed: 42

data:
  deeplure_root: data/deeplure
  kaggle_root: data/kaggle
  splits_csv: outputs/splits.csv
  img_size: 224
  val_frac: 0.15
  test_frac: 0.20

input:
  mode: rgb            # rgb | gray | structure (gray + sobel)

augment:
  hue_rotate: true
  channel_permute: true
  palette_swap: true
  palette_k: 6
  p_synthetic_positive: 0.5
  p_same_palette_negative: 0.25

model:
  backbone: dinov2_vits14   # dinov2_vits14 | efficientnet_b0 | mobilenetv3_large
  embed_dim: 128
  freeze: partial            # frozen | partial | full
  unfreeze_last_n_blocks: 4

loss:
  name: arcface              # arcface | supcon | triplet
  margin: 0.3
  scale: 30.0
  temperature: 0.07

train:
  epochs: 15
  P: 16
  K: 4
  lr_head: 1.0e-3
  lr_backbone: 1.0e-5
  weight_decay: 0.05
  warmup_epochs: 1
  amp: true
  num_workers: 2

eval:
  far_target: 1.0e-3
  ranks: [1, 5]
