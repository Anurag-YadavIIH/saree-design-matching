# Post-hoc leakage exclusion, version 2: LINKS keyed by image_id, not design_id.
# Design ids are renumbered when a borderline geometric match flips between machines
# (DECISIONS.md D-45), so an id-keyed list breaks; image_id is a stable hash of the path.
# evaluate.py excludes a TEST design when its linked partner is in TRAIN in the manifest
# being evaluated, and reports how much of that test set the human audit covered.
# Generated by scripts/make_exclusion_links.py from the 2026-10-02 visual audit.
version: 2
keyed_by: image_id (stable SHA1 of the relative path; never renumbered)
# Rule for test designs the human audit did NOT cover (Kaggle's split can differ from the
# audited one): exclude when the nearest TRAIN image by zero-shot DINOv2 cosine is >= 0.90.
# Evidence from the audit: 12/12 Drive pairs at cosine >= 0.91 were the same saree; 7/13 in
# 0.80 to 0.91. Human judgement always overrides the rule for reviewed designs.
rule:
  unreviewed_nearest_train_cosine_min: 0.90
  embedding: zero-shot DINOv2 ViT-S/14, RGB, 224, max over the design's real images
